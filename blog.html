<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>lyra</title>
    <script>
    // legacy urls: /blog.html?post=slug -> /blog/slug/
    var p = new URLSearchParams(location.search).get('post');
    location.replace(p && /^[a-z0-9_-]+$/i.test(p) ? '/blog/' + p + '/' : '/blog/');
    </script>
</head>
<body></body>
</html>
