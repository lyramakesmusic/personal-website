<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lyra</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><circle cx='8' cy='8' r='6' fill='%238a9e78'/></svg>">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link id="hljs-theme" rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.11.1/build/styles/github-dark.min.css">
    <script>
    // apply saved theme before render to prevent flash (dark is the default)
    if (localStorage.getItem('theme') !== 'light') document.documentElement.classList.add('dark');
    </script>
</head>
<body>
    <nav class="topnav">
        <a href="index.html" class="nav-home">home</a>
        <a href="blog.html">blog</a>
        <button class="theme-toggle" id="theme-toggle"><i class="bi bi-moon"></i></button>
    </nav>

    <article class="post" id="post">
        <noscript>this page needs javascript to render markdown posts.</noscript>
    </article>

    <footer class="blog-footer">
        <a href="index.html" class="back-link">back</a>
        <span>&copy; lyra 2026. feel free to use any piece of content from this site with attribution.</span>
        <span class="footer-spacer"></span>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.11.1/build/highlight.min.js"></script>
    <script>
    (async function () {
        const params = new URLSearchParams(window.location.search);
        const slug = params.get('post');
        const el = document.getElementById('post');

        if (!slug || !/^[a-z0-9_-]+$/i.test(slug)) {
            // show post list
            try {
                const res = await fetch('posts/index.json');
                const posts = await res.json();
                document.title = 'blog — lyra';
                el.innerHTML = '<h1>blog</h1>'
                    + (posts.length ? '' : '<p class="post-error">nothing here yet.</p>')
                    + '<ul class="post-list">' + posts.map(function (p) {
                        return '<li>'
                            + (p.date ? '<span class="post-list-date">' + p.date + '</span>' : '<span class="post-list-date"></span>')
                            + '<a href="blog.html?post=' + p.slug + '">' + p.title + '</a>'
                            + '</li>';
                    }).join('') + '</ul>';
            } catch (e) {
                el.innerHTML = '<p class="post-error">couldn\'t load post list.</p>';
            }
            return;
        }

        try {
            const res = await fetch('posts/' + slug + '.md');
            if (!res.ok) throw new Error(res.status);
            const md = await res.text();

            // strip front matter if present
            let body = md;
            const fmMatch = md.match(/^---\n([\s\S]*?)\n---\n([\s\S]*)$/);
            if (fmMatch) body = fmMatch[2];

            // set page title from first h1 in the markdown
            const h1Match = body.match(/^#\s+(.+)$/m);
            if (h1Match) document.title = h1Match[1] + ' — lyra';

            const bodyHtml = marked.parse(body);

            el.innerHTML = bodyHtml;

            // syntax highlight code blocks
            el.querySelectorAll('pre code').forEach(block => hljs.highlightElement(block));

            // open external links in new tab
            el.querySelectorAll('a').forEach(a => {
                const href = a.getAttribute('href');
                if (href && !href.startsWith('#')) a.target = '_blank';
            });
        } catch (e) {
            el.innerHTML = '<p class="post-error">couldn\'t load post: <code>' + slug + '</code></p>';
        }
    })();

    // dark mode toggle
    (function () {
        const btn = document.getElementById('theme-toggle');
        const hljsLink = document.getElementById('hljs-theme');
        const LIGHT_THEME = 'https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.11.1/build/styles/github.min.css';
        const DARK_THEME = 'https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.11.1/build/styles/github-dark.min.css';

        function apply(dark) {
            document.documentElement.classList.toggle('dark', dark);
            btn.innerHTML = dark ? '<i class="bi bi-sun"></i>' : '<i class="bi bi-moon"></i>';
            hljsLink.href = dark ? DARK_THEME : LIGHT_THEME;
            localStorage.setItem('theme', dark ? 'dark' : 'light');
        }

        apply(document.documentElement.classList.contains('dark'));
        btn.addEventListener('click', function () {
            apply(!document.documentElement.classList.contains('dark'));
        });
    })();
    </script>
</body>
</html>
